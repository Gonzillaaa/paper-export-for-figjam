name: Release checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: node --check plugin/code.js
      - run: node --check demo/build-board/code.js
      - run: npx --yes oxlint@1.94.0 --deny-warnings plugin/code.js demo/build-board/code.js tests
      - run: node --test
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
