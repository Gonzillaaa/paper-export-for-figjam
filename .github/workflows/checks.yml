name: Release checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --check plugin/code.js
      - run: node --check demo/build-board/code.js
      - run: node --check tools/split_export.js
      - run: npm run lint
      - run: npm test
