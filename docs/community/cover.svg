<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Paper Export for FigJam</title>
  <desc>The Team invites sprint board in FigJam beside a close-up of the review in Paper. An expired invite has its Copy link action circled. Sam’s selected note records the change.</desc>
  <rect width="1920" height="1080" fill="#F7F5F9"/>
  <rect width="1920" height="230" fill="#262338"/>
  <image x="55" y="37" width="146" height="146" xlink:href="icon.svg"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="240" y="126" fill="#FFFFFF" font-size="88" font-weight="700" letter-spacing="-3">Paper Export for FigJam</text>
    <text x="245" y="187" fill="#DDD8EE" font-size="39">Move FigJam boards into Paper</text>
    <text x="54" y="345" fill="#393347" font-size="47" font-weight="700">FigJam</text>
    <text x="916" y="345" fill="#393347" font-size="47" font-weight="700">Paper</text>
  </g>
  <path d="M54 382h775m86 0h953" stroke="#C9C3D1" stroke-width="2"/>
  <image x="54" y="410" width="775" height="570" xlink:href="../images/demo-figjam.png" preserveAspectRatio="xMidYMid meet"/>
  <path d="M843 703h55m-17-17 17 17-17 17" fill="none" stroke="#6846A5" stroke-width="6"/>
  <image x="916" y="410" width="953" height="570" xlink:href="../images/demo-paper.png" preserveAspectRatio="xMidYMid meet"/>
</svg>
