<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Paper Export for FigJam: move FigJam boards into Paper</title>
  <desc>Two activities from a launch retrospective. FigJam participants cluster and vote on sticky notes. In Paper the team works on the handoff they selected.</desc>
  <rect width="1920" height="1080" fill="#F9F8F4"/>
  <rect width="1920" height="344" fill="#262338"/>
  <image x="88" y="78" width="180" height="180" xlink:href="icon.svg"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="292" y="199" font-size="112" font-weight="700" letter-spacing="-4" fill="#FFFEFC">Paper Export for FigJam</text>
    <text x="300" y="278" font-size="46" fill="#DDD8EE">Move FigJam boards into Paper</text>
    <path d="M88 449h810m124 0h810" stroke="#CCC9CF" stroke-width="2"/>
    <text x="88" y="424" font-size="38" font-weight="600" fill="#262338">FigJam · Gather &amp; vote</text>
    <text x="1022" y="424" font-size="38" font-weight="600" fill="#262338">Paper · Decide &amp; assign</text>
  </g>
  <svg x="88" y="489" width="810" height="500" viewBox="28 270 942 584" preserveAspectRatio="xMidYMid meet">
    <image width="1430" height="900" xlink:href="../images/demo-figjam.png"/>
  </svg>
  <svg x="1022" y="489" width="810" height="500" viewBox="30 257 954 592" preserveAspectRatio="xMidYMid meet">
    <image width="1430" height="900" xlink:href="../images/demo-paper.png"/>
  </svg>
  <g fill="none" stroke="#423B59" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M929 740h60m-20-20 20 20-20 20"/>
  </g>
</svg>
