<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Paper Export for FigJam</title>
  <desc>A Friday review workshop moves from an evidence wall of FigJam stickies into a service blueprint with editable layers in Paper.</desc>
  <rect width="1920" height="1080" fill="#FAFBF5"/>
  <rect width="1920" height="260" fill="#262338"/>
  <image x="65" y="50" width="155" height="155" xlink:href="icon.svg"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="265" y="141" fill="#FFFFFF" font-size="92" font-weight="700" letter-spacing="-3">Paper Export for FigJam</text>
    <text x="270" y="208" fill="#DDD8EE" font-size="44">Move FigJam boards into Paper</text>
    <text x="65" y="353" fill="#183B34" font-size="36" font-weight="700">FigJam · Evidence wall</text>
    <text x="780" y="353" fill="#183B34" font-size="36" font-weight="700">Paper · Service blueprint</text>
  </g>
  <path d="M65 383h590m125 0h1075" stroke="#ADC3B5" stroke-width="2"/>
  <svg x="65" y="412" width="590" height="642" viewBox="650 285 745 797" preserveAspectRatio="xMidYMid meet">
    <image width="3800" height="2440" xlink:href="../images/workshop-overview.png"/>
  </svg>
  <path d="M682 704h65m-23-23 23 23-23 23" fill="none" stroke="#376952" stroke-width="8"/>
  <svg x="778" y="412" width="1078" height="642" viewBox="0 0 1800 1120" preserveAspectRatio="xMidYMid meet">
    <image width="1800" height="1120" xlink:href="../images/demo-paper.png"/>
  </svg>
</svg>
